<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | International Healthcare Institute</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
body{margin:0;font-family:"Source Sans 3",Arial,sans-serif;color:#33415a;background:#f4f7fb;display:grid;min-height:100dvh;place-items:center;padding:2rem}
.card{background:#fff;border:1px solid #e3e8f0;border-radius:14px;padding:2.5rem;max-width:32rem;text-align:center;box-shadow:0 8px 24px -12px rgba(20,38,74,.18)}
img{width:56px;height:56px;margin:0 auto 1rem}
h1{font-family:"Source Serif 4",Georgia,serif;color:#14264a;font-size:2rem;margin:0 0 .5rem}
p{color:#64748b}
a.btn{display:inline-block;background:#0b4a9b;color:#fff;padding:.75rem 1.4rem;border-radius:8px;font-weight:600;text-decoration:none;margin-top:.5rem}
nav a{color:#1f5fbf;margin:0 .5rem;font-size:.9rem}
</style>
</head>
<body>
<div class="card">
  <img src="/assets/img/logo.png" alt="" id="logo">
  <h1>Page not found</h1>
  <p>The page you requested doesn't exist or has moved.</p>
  <a class="btn" href="/" data-p>Back to home</a>
  <nav style="margin-top:1.25rem"><a href="/services/" data-p>Services</a><a href="/faq/" data-p>FAQ</a><a href="/contactus/" data-p>Contact</a></nav>
</div>
<script>
(function(){var m=location.pathname.match(/^\/[^\/]+\//);var base=(location.hostname.endsWith('github.io')&&m)?m[0].slice(0,-1):'';
if(base){document.querySelectorAll('[data-p]').forEach(function(a){a.setAttribute('href',base+a.getAttribute('href'));});document.getElementById('logo').src=base+'/assets/img/logo.png';}})();
</script>
</body>
</html>
